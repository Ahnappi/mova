# 用 GitHub Actions 在云端构建 Windows / macOS 桌面包。
#
# 触发方式（二选一）：
#   1) 推送 tag：git tag v1.0.0 && git push origin v1.0.0   -> 构建并自动发布 Release
#   2) 手动：GitHub 仓库页 -> Actions -> Build Desktop -> Run workflow -> 只上传产物
#
# ---------------------------------------------------------------------------
# 产物命名：mova_<平台>_<架构>
#   Windows : mova_win_x64          便携版（zip，解压即用，不写注册表）
#             mova_win_x64_setup    安装程序（Inno Setup 编译出的 exe）
#   macOS   : mova_mac_arm64        .app（zip / tar.gz）
#             mova_mac_arm64.dmg    DMG（打开后拖进 Applications）
#
# 两个平台都同时给「便携版」和「安装包」：便携版不写注册表、不留痕迹，
# 安装包则在系统里挂号——开始菜单快捷方式 + Windows「应用和功能」里的
# 卸载项（unins000.exe）。
#
# 打包脚本在 installers/ 下，可以脱离 CI 单独跑：
#   iscc installers\windows\mova.iss /DMyAppVersion=1.2.3
#   bash installers/macos/make_dmg.sh
#
# ---------------------------------------------------------------------------
# 关于签名公证（没做，以及会有什么后果）
#
# 目前**没有**做代码签名与公证，因为只给自己用，不值得为此买证书：
#   - Windows：首次安装会弹 SmartScreen「Windows 已保护你的电脑」，
#     点「更多信息 → 仍要运行」即可，同一个安装包只会问一次。
#   - macOS：首次打开会被 Gatekeeper 挡住，需要右键 → 打开放行一次，
#     之后系统就记住了。
#
# 哪天要给外人用，这两处就是必须补的（都要花钱）：
#   - Windows：OV/EV 代码签名证书 + signtool，加到 iscc 之后。
#   - macOS：Apple Developer 账号（¥688/年）→ Developer ID 签名
#     → notarytool 公证 → stapler 钉票。make_dmg.sh 的注释里有现成命令。
# ---------------------------------------------------------------------------
# 关于「压缩包套压缩包」（重要）
#
# upload-artifact@v6 会把上传内容**强制再打一层 zip**，且没有关闭选项。
# 因此：上传一个 .zip -> 下载得到 zip(zip(...))。要避免嵌套，就必须上传「目录」
# 或「非压缩包文件」，让 artifact 自己生成的那层 zip 成为唯一的一层。
#
#   Windows：直接上传 Release 目录        -> 下载 zip 里就是 mova.exe / dll / data ✅ 单层
#   macOS  ：**不能直接上传 .app 目录**！
#            upload-artifact 的 zip 会丢掉文件权限（全部 644，可执行文件失去 +x）
#            且不保留符号链接（mova.app 内有 12 个），解出来的 app 无法启动。
#            所以 macOS 必须先 tar（tar 能完整保留权限与符号链接）再上传。
#
# 结论：
#   - Artifacts（Actions 页面下载）：Windows 单层；macOS 是 zip(tar.gz)，
#     解压后得到 mova_mac_arm64.tar.gz，再解压出 mova.app（这是 GitHub 限制所致）。
#   - Release 资源（打 tag 才有）：两边都是**干净的单层 zip**，推荐从这里下载。
# ---------------------------------------------------------------------------
# 关于 action 版本（别改回去）
#
# 2025-09 起 GitHub Actions 停用 Node 20 运行时，仍在 node20 上的 action 会被
# 强行拖到 Node 24 并打出弃用警告（将来会直接失败）。因此这里统一用已经迁移
# 到 node24 的大版本：
#
#   actions/checkout          v4 -> v6     （v6 起 node24）
#   actions/upload-artifact   v4 -> v6     （v6 起 node24；v5 仍是 node20，不够）
#   softprops/action-gh-release v2 -> v3   （v3 = node24，官方说明只是换运行时）
#
# 这三处升级都不改变本流程用到的输入项（name / path / files），产物结构不变。
# 若改用自托管 runner，需要 Actions Runner >= 2.327.1 才支持 node24。
#
# 注：subosito/flutter-action 是 composite action（内部是 shell 步骤），
# 不受 Node 运行时弃用影响，保持 v2 即可。
# ---------------------------------------------------------------------------

name: Build Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  WIN_ASSET: mova_win_x64
  MAC_ASSET: mova_mac_arm64

jobs:
  # ---------------- 测试（先跑，失败就不再打包） ----------------
  # 单独一个 job：协议/超时/断连/会话切换这几组用例跑的是真实 loopback TCP，
  # 放在 Linux 上最快也最稳；失败即阻断后续两个打包任务。
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 定位 Flutter 工程目录
        id: locate
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            found=$(find . -maxdepth 4 -name pubspec.yaml -not -path "*/build/*" | head -n 1)
            echo "dir=$(dirname "$found")" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get
        working-directory: ${{ steps.locate.outputs.dir }}

      - name: 运行测试
        run: flutter test
        working-directory: ${{ steps.locate.outputs.dir }}

  # ---------------- Windows ----------------
  build-windows:
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6

      # 自动定位 Flutter 工程目录：仓库根就是工程，或工程在子目录都能用。
      - name: 定位 Flutter 工程目录
        id: locate
        shell: bash
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            found=$(find . -maxdepth 4 -name pubspec.yaml -not -path "*/build/*" | head -n 1)
            echo "dir=$(dirname "$found")" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get
        working-directory: ${{ steps.locate.outputs.dir }}

      # --no-fatal-infos：info 级 lint 不阻断构建（项目目前有若干风格提示）。
      - name: 静态分析
        run: flutter analyze --no-fatal-infos
        working-directory: ${{ steps.locate.outputs.dir }}

      - name: 构建 Windows 发布版
        run: flutter build windows --release
        working-directory: ${{ steps.locate.outputs.dir }}

      # 供 Release 使用的单层 zip：zip 根目录下直接是 mova.exe / flutter_windows.dll / data。
      # exe 依赖同目录的 dll 与 data 资源，必须整包压缩，不能只发 exe。
      - name: 打包为 zip（Release 用）
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:PROJECT_DIR/dist" | Out-Null
          Compress-Archive -Path "$env:PROJECT_DIR/build/windows/x64/runner/Release/*" `
            -DestinationPath "$env:PROJECT_DIR/dist/$env:WIN_ASSET.zip" -Force

      # 安装程序的版本号从 pubspec 取，避免「exe 里是 1.0.0、安装包写着
      # 别的版本」这种三处不一致。
      - name: 取版本号
        id: ver
        shell: bash
        run: |
          v=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | sed 's/+.*//')
          echo "app_version=$v" >> "$GITHUB_OUTPUT"
        working-directory: ${{ steps.locate.outputs.dir }}

      # windows-latest 预装了 Inno Setup，但 iscc 不一定在 PATH 里，先探一下。
      - name: 定位 Inno Setup
        id: iscc
        shell: pwsh
        run: |
          $found = Get-Command iscc -ErrorAction SilentlyContinue
          if ($found) {
            $path = $found.Source
          } else {
            $path = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $path)) {
            Write-Error "这台 runner 上没有 Inno Setup（PATH 与默认安装位置都找过）"
            exit 1
          }
          Write-Host "使用: $path"
          "path=$path" >> $env:GITHUB_OUTPUT

      # 生成安装程序：装进 Program Files、建开始菜单快捷方式、在
      # 「设置 → 应用和功能」里注册卸载项。脚本里的相对路径是相对脚本
      # 自身位置解析的，所以这里传绝对路径即可。
      - name: 生成 Windows 安装程序
        shell: pwsh
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          & "${{ steps.iscc.outputs.path }}" `
            "$env:PROJECT_DIR\installers\windows\mova.iss" `
            "/DMyAppVersion=${{ steps.ver.outputs.app_version }}" `
            "/DMyOutputBaseFilename=mova_win_x64_setup"
        working-directory: ${{ steps.locate.outputs.dir }}

      # 直接上传目录 -> artifact 的 zip 就是唯一一层，解压即用，不再套娃。
      - name: 上传便携版产物
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.WIN_ASSET }}
          path: ${{ steps.locate.outputs.dir }}/build/windows/x64/runner/Release

      # 安装程序是单个 exe，artifact 会再套一层 zip（GitHub 限制，无法关闭）。
      # 下载后解压出 mova_win_x64_setup.exe 双击即可，多一步解压而已。
      - name: 上传安装程序
        uses: actions/upload-artifact@v6
        with:
          name: mova_win_x64_setup
          path: ${{ steps.locate.outputs.dir }}/dist/mova_win_x64_setup.exe

      - name: 发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ${{ steps.locate.outputs.dir }}/dist/${{ env.WIN_ASSET }}.zip
            ${{ steps.locate.outputs.dir }}/dist/mova_win_x64_setup.exe

  # ---------------- macOS ----------------
  build-macos:
    runs-on: macos-latest
    needs: verify

    steps:
      - uses: actions/checkout@v6

      - name: 定位 Flutter 工程目录
        id: locate
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            found=$(find . -maxdepth 4 -name pubspec.yaml -not -path "*/build/*" | head -n 1)
            echo "dir=$(dirname "$found")" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get
        working-directory: ${{ steps.locate.outputs.dir }}

      - name: 构建 macOS 发布版
        run: flutter build macos --release
        working-directory: ${{ steps.locate.outputs.dir }}

      - name: 打包（tar 供 Artifact，zip 供 Release）
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          cd "$PROJECT_DIR"
          mkdir -p dist
          APP="build/macos/Build/Products/Release/mova.app"

          # tar：完整保留符号链接与可执行权限，供 Artifact 上传（见文件头说明）。
          tar -czf "dist/$MAC_ASSET.tar.gz" -C "build/macos/Build/Products/Release" mova.app

          # zip：Mac 用户双击即可解压出完整的 mova.app，作为 Release 资源。
          # --keepParent 保证解压后是 mova.app 而不是散落的文件。
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/$MAC_ASSET.zip"

          # DMG：macOS 分发桌面应用的常规形式——打开后把 mova.app 拖到
          # 镜像里的 Applications 就装好了。脚本自己读 pubspec 的版本号。
          # 用 bash 调用（而不是依赖可执行位），免得 git 把 +x 丢了。
          bash installers/macos/make_dmg.sh

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.MAC_ASSET }}
          path: ${{ steps.locate.outputs.dir }}/dist/${{ env.MAC_ASSET }}.tar.gz

      - name: 上传 DMG
        uses: actions/upload-artifact@v6
        with:
          name: mova_mac_arm64_dmg
          path: ${{ steps.locate.outputs.dir }}/dist/${{ env.MAC_ASSET }}.dmg

      - name: 发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ${{ steps.locate.outputs.dir }}/dist/${{ env.MAC_ASSET }}.zip
            ${{ steps.locate.outputs.dir }}/dist/${{ env.MAC_ASSET }}.dmg

# ---------------------------------------------------------------------------
# 附：如果要出 Intel Mac 的包
#   macos-latest 现在是 Apple Silicon，只能构建 arm64。要同时支持 Intel Mac，
#   把 build-macos 改成 matrix：runs-on: [macos-latest, macos-13]（macos-13 是 Intel），
#   并把 MAC_ASSET 按 runner 分别设为 mova_mac_arm64 / mova_mac_x64。
# ---------------------------------------------------------------------------
